
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#141418">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="manifest" href="manifest.json">

    <title>CFMusic</title>

    <style>
        body {
            background: #141418;
            color: white;
            font-family: system-ui, sans-serif;
            text-align: center;
            padding: 40px 15px;
        }

        button {
            background: #292930;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px;
            margin: 3px;
            font-size: 18px;
        }

        audio {
            width: 100%;
            margin-top: 25px;
        }

        #title {
            overflow-wrap: anywhere;
        }

        #status {
            color: #999;
        }
    </style>
</head>

<body>

    <h1>CFMusic</h1>
    <p>Prototype 0.0.1</p>

    <input id="files" type="file" accept="audio/*" multiple>

    <h2 id="title">No music selected</h2>
    <p id="status">Ready</p>

    <div>
        <button onclick="previous()">⏮</button>
        <button onclick="seek(-10)">−10s</button>
        <button onclick="toggle()" id="playButton">▶</button>
        <button onclick="seek(10)">+10s</button>
        <button onclick="next()">⏭</button>
    </div>

    <audio id="audio" controls preload="auto"></audio>

    <script>
        const audio = document.getElementById("audio");
        const title = document.getElementById("title");
        const status = document.getElementById("status");
        const playButton = document.getElementById("playButton");

        let tracks = [];
        let current = 0;

        document.getElementById("files").onchange = event => {
            audio.pause();

            tracks.forEach(track => URL.revokeObjectURL(track.url));

            tracks = Array.from(event.target.files).map(file => ({
                title: file.name.replace(/\.[^.]+$/, ""),
                url: URL.createObjectURL(file)
            }));

            if (tracks.length) load(0);
        };

        function load(index, autoplay = false) {
            if (!tracks.length) return;

            current = (index + tracks.length) % tracks.length;

            const track = tracks[current];

            audio.src = track.url;
            title.textContent = track.title;
            status.textContent = `${current + 1} / ${tracks.length}`;

            if ("mediaSession" in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.title,
                    artist: "CFMusic",
                    album: "Local library"
                });
            }

            if (autoplay) play();
        }

        function play() {
            if (!tracks.length) return;

            audio.play().catch(error => {
                status.textContent = error.message;
            });
        }

        function toggle() {
            audio.paused ? play() : audio.pause();
        }

        function next() {
            load(current + 1, true);
        }

        function previous() {
            load(current - 1, true);
        }

        function seek(seconds) {
            if (!Number.isFinite(audio.duration)) return;

            audio.currentTime = Math.max(
                0,
                Math.min(
                    audio.duration,
                    audio.currentTime + seconds
                )
            );
        }

        audio.onended = next;

        audio.onplaying = () => {
            playButton.textContent = "⏸";
            status.textContent = "Playing";

            if ("mediaSession" in navigator) {
                navigator.mediaSession.playbackState = "playing";
            }
        };

        audio.onpause = () => {
            playButton.textContent = "▶";
            status.textContent = "Paused";

            if ("mediaSession" in navigator) {
                navigator.mediaSession.playbackState = "paused";
            }
        };

        audio.onerror = () => {
            status.textContent = "Audio loading error";
        };

        if ("mediaSession" in navigator) {
            const actions = {
                play: play,
                pause: () => audio.pause(),
                nexttrack: next,
                previoustrack: previous,
                seekforward: event => seek(event.seekOffset || 10),
                seekbackward: event => seek(-(event.seekOffset || 10)),
                seekto: event => {
                    if (Number.isFinite(event.seekTime)) {
                        audio.currentTime = event.seekTime;
                    }
                }
            };

            for (const [action, handler] of Object.entries(actions)) {
                try {
                    navigator.mediaSession.setActionHandler(action, handler);
                } catch (error) {
                    console.log(action, error);
                }
            }

            audio.addEventListener("timeupdate", () => {
                if (
                    Number.isFinite(audio.duration) &&
                    audio.duration > 0
                ) {
                    try {
                        navigator.mediaSession.setPositionState({
                            duration: audio.duration,
                            playbackRate: audio.playbackRate,
                            position: Math.min(
                                audio.currentTime,
                                audio.duration
                            )
                        });
                    } catch (error) {}
                }
            });
        }

        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("./sw.js")
                .catch(console.error);
        }
    </script>

</body>
</html>
