
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#141418">
    <meta name="apple-mobile-web-app-capable" content="yes">

    <link rel="manifest" href="manifest.json">

    <title>CFMusic</title>

    <style>
        body {
            background: #141418;
            color: white;
            font-family: system-ui, sans-serif;
            text-align: center;
            padding: 40px 15px;
        }

        button, .import-button {
            display: inline-block;
            background: #292930;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 15px;
            margin: 3px;
            font-size: 18px;
            cursor: pointer;
        }

        .import-button {
            background: #354b80;
            margin-bottom: 20px;
        }

        #files {
            display: block;
            margin: 15px auto;
            max-width: 100%;
        }

        audio {
            width: 100%;
            margin-top: 25px;
        }

        #title {
            overflow-wrap: anywhere;
        }

        #status, #counter {
            color: #999;
        }

        #debug {
            margin-top: 25px;
            color: #aaa;
            font-size: 12px;
            text-align: left;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }
    </style>
</head>

<body>

    <h1>CFMusic</h1>
    <p>Prototype 0.0.2</p>

    <label for="files" class="import-button">
        Import Music
    </label>

    <input id="files" type="file" multiple>

    <p id="counter">0 tracks loaded</p>
    <h2 id="title">No music selected</h2>
    <p id="status">Ready</p>

    <div>
        <button onclick="previous()">⏮</button>
        <button onclick="seek(-10)">−10s</button>
        <button onclick="toggle()" id="playButton">▶</button>
        <button onclick="seek(10)">+10s</button>
        <button onclick="next()">⏭</button>
    </div>

    <audio id="audio" controls preload="auto"></audio>

    <div id="debug"></div>

<script>
    const audio = document.getElementById("audio");
    const title = document.getElementById("title");
    const status = document.getElementById("status");
    const counter = document.getElementById("counter");
    const playButton = document.getElementById("playButton");
    const files = document.getElementById("files");
    const debug = document.getElementById("debug");

    let tracks = [];
    let current = 0;

    function log(message) {
        debug.textContent += message + "\n";
    }

    log("CFMusic 0.0.2 started");

    files.addEventListener("click", () => {
        log("Opening file picker...");
    });

    files.addEventListener("change", event => {
        const selected = Array.from(event.target.files);

        log("Selected files: " + selected.length);

        if (!selected.length) return;

        const supported = selected.filter(file =>
            /\.(mp3|m4a|aac|wav|flac|ogg|opus|webm)$/i.test(file.name)
            || file.type.startsWith("audio/")
        );

        if (!supported.length) {
            status.textContent = "No supported audio files";
            return;
        }

        audio.pause();
        audio.removeAttribute("src");
        audio.load();

        tracks.forEach(track => {
            URL.revokeObjectURL(track.url);
        });

        tracks = supported.map(file => {
            log("Loaded: " + file.name);

            return {
                title: file.name.replace(/\.[^.]+$/, ""),
                url: URL.createObjectURL(file)
            };
        });

        counter.textContent = tracks.length + " tracks loaded";

        load(0);

        files.value = "";
    });

    function load(index, autoplay = false) {
        if (!tracks.length) return;

        current = (index + tracks.length) % tracks.length;

        const track = tracks[current];

        audio.src = track.url;

        title.textContent = track.title;

        status.textContent =
            (current + 1) + " / " + tracks.length;

        log("Current track: " + track.title);

        if ("mediaSession" in navigator &&
            "MediaMetadata" in window) {

            try {
                navigator.mediaSession.metadata =
                    new MediaMetadata({
                        title: track.title,
                        artist: "CFMusic",
                        album: "Local library"
                    });
            } catch (error) {
                log(error.message);
            }
        }

        if (autoplay) play();
    }

    function play() {
        if (!tracks.length) {
            status.textContent = "Import music first";
            return;
        }

        audio.play().catch(error => {
            status.textContent = error.message;
            log("Playback error: " + error.message);
        });
    }

    function toggle() {
        audio.paused ? play() : audio.pause();
    }

    function next() {
        load(current + 1, true);
    }

    function previous() {
        load(current - 1, true);
    }

    function seek(seconds) {
        if (!Number.isFinite(audio.duration)) return;

        audio.currentTime = Math.max(
            0,
            Math.min(
                audio.duration,
                audio.currentTime + seconds
            )
        );
    }

    audio.addEventListener("ended", () => {
        log("Track finished");
        next();
    });

    audio.addEventListener("playing", () => {
        playButton.textContent = "⏸";
        status.textContent = "Playing";

        if ("mediaSession" in navigator) {
            navigator.mediaSession.playbackState = "playing";
        }
    });

    audio.addEventListener("pause", () => {
        playButton.textContent = "▶";
        status.textContent = "Paused";

        if ("mediaSession" in navigator) {
            navigator.mediaSession.playbackState = "paused";
        }
    });

    audio.addEventListener("error", () => {
        status.textContent = "Audio loading error";

        if (audio.error) {
            log("Audio error: " + audio.error.code);
        }
    });

    if ("mediaSession" in navigator) {

        log("Media Session supported");

        const actions = {
            play: play,
            pause: () => audio.pause(),
            nexttrack: next,
            previoustrack: previous,
            seekforward: event =>
                seek(event.seekOffset || 10),
            seekbackward: event =>
                seek(-(event.seekOffset || 10)),
            seekto: event => {
                if (Number.isFinite(event.seekTime)) {
                    audio.currentTime = event.seekTime;
                }
            }
        };

        for (const [action, handler] of Object.entries(actions)) {
            try {
                navigator.mediaSession.setActionHandler(
                    action,
                    handler
                );
            } catch (error) {
                log(action + ": unsupported");
            }
        }

        audio.addEventListener("timeupdate", () => {
            if (
                Number.isFinite(audio.duration) &&
                audio.duration > 0
            ) {
                try {
                    navigator.mediaSession.setPositionState({
                        duration: audio.duration,
                        playbackRate: audio.playbackRate,
                        position: Math.min(
                            audio.currentTime,
                            audio.duration
                        )
                    });
                } catch (error) {}
            }
        });
    }

    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js")
            .then(() => log("Service Worker registered"))
            .catch(error => log(error.message));
    }
</script>

</body>
</html>
